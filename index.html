<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSE TIKET - ICONNET</title>
    
    <link rel="icon" type="image/png" href="https://play-lh.googleusercontent.com/9nJ5D1-b66o2J8lB9y80-zX5t-xVfWbUebPqUuK2aZ52n_4Q9Q_t8uFpW_Lp2wG5Vw=w240-h480-rw">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <img src="https://iconnetsumut.com/wp-content/uploads/2023/09/logo-iconnet.webp" alt="Logo ICONNET" class="logo">
                <div class="brand-text">
                    <span class="brand-title">CLOSE TIKET</span>
                    <span class="brand-sub">by <a href="https://ngetik-id.vercel.app/" target="_blank">ngetik id</a></span>
                </div>
            </div>

            <nav class="nav-links">
                <a href="konfirmasi.html" target="_blank" class="nav-link">Konfirmasi WA</a>
                <a href="https://closetiket.vercel.app/replaceont.html#" target="_blank" class="nav-link">Replace ONT</a>
                <a href="http://closetiket.vercel.app/pindah-fat.html" target="_blank" class="nav-link">Pindah FAT</a>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Ganti Tema">🌙 Dark</button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper">
        
        <!-- SISI KIRI: INPUT DATA -->
        <section class="form-container">
            
            <!-- Card Paste Tiket Mentah -->
            <div class="card">
                <div class="input-group full-width">
                    <label for="raw">Paste Tiket Mentah</label>
                    <textarea id="raw" placeholder="Tempelkan data tiket mentah di sini..."></textarea>
                    <button class="btn-primary" onclick="ambilData()">Generate Data Otomatis</button>
                </div>
            </div>

            <!-- Card Informasi Pelanggan -->
            <div class="card">
                <h2 class="section-title">Informasi Pelanggan</h2>
                
                <div class="grid-row-3">
                    <div class="input-group">
                        <label for="notiket">No Tiket</label>
                        <input type="text" id="notiket" placeholder="Tkt-xxxxx">
                    </div>
                    <div class="input-group">
                        <label for="insiden">No Insiden</label>
                        <input type="text" id="insiden" placeholder="INS-xxxxx">
                    </div>
                    <div class="input-group">
                        <label for="nama">Nama Pelanggan</label>
                        <input type="text" id="nama" placeholder="Nama lengkap">
                    </div>
                </div>

                <div class="grid-row-3">
                    <div class="input-group">
                        <label for="sid">SID</label>
                        <input type="text" id="sid" placeholder="SID pelanggan">
                    </div>
                    <div class="input-group">
                        <label for="layanan">Layanan (Mbps)</label>
                        <input type="text" id="layanan" placeholder="Contoh: 20">
                    </div>
                    <div class="input-group">
                        <label for="tim">Tim Teknisi <span class="required">*</span></label>
                        <input type="text" id="tim" list="daftar-tim" placeholder="Ketik atau pilih tim" required>
                        <datalist id="daftar-tim"></datalist>
                    </div>
                </div>

                <div class="input-group full-width">
                    <label for="alamat">Alamat Pelanggan</label>
                    <input type="text" id="alamat" placeholder="Alamat lengkap lokasi">
                </div>
            </div>

            <!-- Card Perbaikan & Titik Koordinat -->
            <div class="card">
                <h2 class="section-title">Perbaikan & Titik Koordinat</h2>
                
                <div class="grid-row-2">
                    <div class="input-group">
                        <label for="rootcause">Rootcause <span class="required">*</span></label>
                        <input type="text" id="rootcause" placeholder="Contoh: Kabel Dropcore Putus">
                    </div>
                    <div class="input-group">
                        <label for="action">Action <span class="required">*</span></label>
                        <input type="text" id="action" placeholder="Contoh: Splicing ulang & Perbaikan Pathcord">
                    </div>
                </div>

                <div class="grid-row-2">
                    <div class="input-group">
                        <label for="tikoruser">Tikor User <span class="required">*</span></label>
                        <input type="text" id="tikoruser" placeholder="Koordinat lokasi rumah user">
                    </div>
                    <div class="input-group">
                        <label for="tikorputus">Tikor Titik Putus</label>
                        <input type="text" id="tikorputus" placeholder="Koordinat titik lokasi kabel putus">
                    </div>
                </div>
            </div>

            <!-- Card Material Terpakai -->
            <div class="card">
                <h2 class="section-title">Material Terpakai</h2>
                
                <div class="grid-row-2">
                    <div class="input-group">
                        <label for="snkabel">SN Kabel</label>
                        <input type="text" id="snkabel" placeholder="Serial Number Kabel">
                    </div>
                    <div class="input-group">
                        <label for="snont">SN ONT</label>
                        <input type="text" id="snont" placeholder="Serial Number ONT">
                    </div>
                </div>

                <div class="grid-row-2">
                    <div class="input-group">
                        <label for="apc">Pathcord APC</label>
                        <input type="text" id="apc" placeholder="Jumlah / Tipe">
                    </div>
                    <div class="input-group">
                        <label for="upc">Pathcord UPC</label>
                        <input type="text" id="upc" placeholder="Jumlah / Tipe">
                    </div>
                </div>

                <div class="grid-row-2">
                    <div class="input-group">
                        <label for="sleeve">Sleeve Protektor</label>
                        <input type="text" id="sleeve" placeholder="Jumlah sleeve">
                    </div>
                    <div class="input-group">
                        <label for="pigtail">Pigtail</label>
                        <input type="text" id="pigtail" placeholder="Jumlah pigtail">
                    </div>
                </div>
            </div>

        </section>

        <!-- SISI KANAN: PANEL HASIL FORMAT CLOSE -->
        <aside class="control-container">
            <div class="card sticky-card">
                <h2 class="section-title">Hasil Format Close</h2>
                
                <div class="action-buttons">
                    <button class="btn-success" onclick="generate()">Format Close</button>
                    <button class="btn-copy" onclick="copyText()">Copy</button>
                    <button class="btn-danger" onclick="resetForm()">Reset</button>
                </div>

                <textarea id="hasil" readonly placeholder="Hasil format close tiket siap salin akan muncul di sini..."></textarea>
            </div>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
