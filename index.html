<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Akses</title>
</head>
<body>
    <button onclick="jalankanPrank()">Lanjutkan</button>
    
    <audio id="audioPrank" preload="auto">
        <source src="Sound dsh - Akun Kesatu.mp3" type="audio/mpeg">
    </audio>

    <script>
        function jalankanPrank() {
            var pemutar = document.getElementById("audioPrank");
            pemutar.volume = 1.0;
            pemutar.play().catch(function(error) {
                console.log("Pemutaran dicegah:", error);
            });
        }
    </script>
</body>
</html>
