<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            cursor: pointer;
            user-select: none;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .teks-utama {
            font-size: 24px;
            margin-bottom: 30px;
        }
        .teks-besar {
            font-size: 48px;
            font-weight: bold;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="teks-utama">Ketuk layar untuk melanjutkan</div>
        <div class="teks-besar">ZONK! ANDA KENA PRANK!</div>
    </div>

    <audio id="audioPrank" preload="auto">
        <source src="Sound dsh - Akun Kesatu.MP3" type="audio/mpeg">
    </audio>

    <script>
        function putarAudio() {
            var pemutar = document.getElementById("audioPrank");
            pemutar.volume = 1.0;
            pemutar.play().then(function() {
                document.removeEventListener("click", putarAudio);
                document.removeEventListener("touchstart", putarAudio);
            }).catch(function(err) {
                console.log("Error:", err);
            });
        }

        document.addEventListener("click", putarAudio);
        document.addEventListener("touchstart", putarAudio);
    </script>

</body>
</html>
